<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<title>パレット変換</title>
<script type="text/javascript"><!--
const lf = '\n';
const sfc_palette_def = {
 name: 'SFC Palette',
 desc: 'RGB555 - 0BBBBBGGGGGRRRRR',
 r: {shift:0 , mask:0x1F},
 g: {shift:5 , mask:0x1F},
 b: {shift:10, mask:0x1F},
};
const msx_palette_def = {
 name: 'MSX Palette',
 desc: 'RGB333 - 00000GGG0RRR0BBB',
 r: {shift:4 , mask:0x07},
 g: {shift:8 , mask:0x07},
 b: {shift:0 , mask:0x07},
};
const option_dic  = {
	sfc_16bit: {
		name: 'SFCパレット 16bit値リスト',
		bit: 16,
		format: sfc_palette_def
	},
	sfc_8bit: {
		name: 'SFCパレット ダンプリスト',
		bit: 8,
		format: sfc_palette_def
	},
	msx_16bit: {
		name: 'MSXパレット 16bit値リスト',
		bit: 16,
		format: msx_palette_def
	},
	msx_8bit: {
		name: 'MSXパレット ダンプリスト',
		bit: 8,
		format: msx_palette_def
	},
}
//==========================================
// optionに対応するoption情報を返す
//==========================================
function getOption( opt_control ) {
	return option_dic[ opt_control.value ];
}
//==========================================
// パレットフォーマットを参照してRGB888配列に変換
//==========================================
function doShiftAndMask(v, shift, mask) {
	return Math.floor(((v >> shift) & mask) * 0xFF / mask);
}
function toRGB888(v, f) {
	return {
		r:doShiftAndMask(v, f.r.shift, f.r.mask), // R
		g:doShiftAndMask(v, f.g.shift, f.g.mask), // G
		b:doShiftAndMask(v, f.b.shift, f.b.mask), // B
	};
}
		
//==========================================
// 16進数から数値へ変換
// $付き、0x付き、接頭辞無しに対応
//==========================================
function decodeHex(s) {
	s = s.replace(/(\/\/).+/g,'') // 行コメント除外
	s = s.replace(/$$([0-9A-F]+)/i,'0x$1');	// $nnnnを0xnnnnに
	s = s.match(/\b($$|0x)?[0-9A-F]+\b/i); // 16進数か検査
	if (!s) return -1;
	return parseInt(s[0], 16);
}
//==========================================
// 16進数文字列へ変換
//==========================================
function toHex(v, zero = '00') {
	var s = zero + v.toString(16).toUpperCase()
	return s.substr(s.length - zero.length);
}
//==========================================
// パレット文字列変換
//==========================================
function convertToBzPalette(s, option) {
	// スペース、カンマ、改行を区切り扱い
	// コメント等は非対応
	var ln = s.replace(/([^\s]+)\s+/g,'$1,').replace(/[\-,]/g,lf).split(lf);
	var out = [];
	var bits = 0;
	var d = 0;
	var sc = '';
	var cn = 0;
	for (var i = 0; i < ln.length; ++i) {
		var c = ln[i];
		if (!c.length) continue;
		var v = decodeHex(c);
		if (v < 0) continue;
		bits += option.bit;
		if (option.bit == 8) {
			if (bits == 8) {
				d = v;
				sc = c;
				continue;
			} else {
				d = d + (v << 8);
				sc = sc + ',' + c;
			}
		} else {
			d = v;
			sc = c;
		}
		var rgb = toRGB888(d, option.format);
		out.push( 
		  '0x' + toHex(cn) + ' rgb' 
		  + '(0x' + toHex(rgb.r) // R
		  + ',0x' + toHex(rgb.g) // G
		  + ',0x' + toHex(rgb.b) // B
		  + ')'
		  + '\t// ' + sc
		);
		d = 0;
		bits = 0;
		++cn;
	}
	return out.join(lf);
}
//==========================================
// 変換開始処理
//==========================================
var opt_control = null;
var src_control = null;
var dst_control = null;
function convert() {
	if (!src_control) return;
	if (!dst_control) return;
	if (!opt_control) return;
	var option = getOption(opt_control);
	if (!option) return;
	var res = convertToBzPalette( src_control.value, option );
	dst.innerText = 
	  '// ' + option.format.name + lf + 
	  '// ' + option.format.desc + lf + 
	  '// -> RGB888' + lf +
	  res;
	console.log(res);
}
//==========================================
// 読み込み完了時
//==========================================
window.onload = function() {
	opt_control = document.getElementById("opt");
	src_control = document.getElementById("src");
	dst_control = document.getElementById("dst");

	if (opt_control) {
		var isFirst = true;
		for (var i in option_dic) {
			const n = document.createElement('option');
			n.value = i;
			n.text = option_dic[i].name;
			n.select = isFirst;
			isFirst = false;
			opt_control.add(n);
		}
		opt_control.onchange = function() {
			var option = getOption(opt_control);
			if (!option) return;
			if (option.bit == 8) {
				src_control.cols = 80;
				src_control.rows = 8;
				src_control.placeholder = 
					'ここに8bitダンプを入力（16進数）' + 
					'（※アドレスや文字表示部は取り除いてください）';
			} else {
				src_control.cols = 24;
				src_control.rows = 16;
				src_control.placeholder = 'ここに16bitパレットを入力（16進数）';
			}
			//src_control.value = '';
			dst_control.innerText = 'ここに結果表示'
		};
		opt_control.onchange();
	}
}
// --> </script>
</head>
<body>
	<select id="opt">
	</select>
	<form>
		<textarea id="src" rows="16" cols="24" placeholder="ここに16進数パレットを入力"></textarea><br>
		<button type="button" onclick="convert()">Bzパレットへ変換</button>
	</form>
	<div id="dst">ここに結果表示</div>
</body>
</html>
