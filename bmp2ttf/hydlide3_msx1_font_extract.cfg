# =============================================================================
# フォント定義ファイル MSX1 OP/ED/MAIN
#
# 書式: 開始アドレス, 文字数, ビット形式
#
# ・開始アドレス: 16進数 (0x2B400 または 2B400H) / 10進数
# ・文字数      : 10進数 / 乗算式 (例: 256*2)
# ・ビット形式  : 8x8, 16x8, 8x8x2
# ・コメント    : '#' または ';' 以降はすべてコメント
# =============================================================================

# ----------------------------------------------------------------------------
# MSX1 OP/ED用フォント
# アスキーコード 20H～7FH (96文字, 8x8）(表示は4x8)
3400H,  96,    8x8

# MSXアスキーコード 80H～FFH (計128文字)
3700H,  128,    8x8    ; 80H～FFH (通常16x8)

# 漢字ブロック (64+96個, 8x8)
3B00H,  64,     8x8    ; 07H+00H～3FH ：漢字＋ロゴ
3D00H,  96,     8x8    ; 07H+40H～9FH ：全角英数字

# ----------------------------------------------------------------------------
# MSX1 MAIN用フォント
# 漢字ブロック (256*2個, 8x8)
7E000H, 256,    8x8    ; FEH+00H～FFH ：漢字(FEH開始)
7E800H, 256,    8x8    ; FFH+00H～FFH ：漢字(FFH開始)

# アスキーコード 20H～FFH (文字, 8x8）(表示は4x8)
7F000H, 224,    8x8


