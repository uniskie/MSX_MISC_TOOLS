<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<title>パレット変換</title>
<script type="text/javascript"><!--
const lf = '\n';
const sfc_16bit_def = {
 name: 'SFC 16bit Palette',
 desc: 'RGB555 - 0BBBBBGGGGGRRRRR (16ビット値)',
 r: {shift:0 , mask:0x1F},
 g: {shift:5 , mask:0x1F},
 b: {shift:10, mask:0x1F},
};
const msx_16bit_def = {
 name: 'MSX 16bit Palette',
 desc: 'RGB333 - 00000GGG0RRR0BBB (16ビット値)',
 r: {shift:4 , mask:0x07},
 g: {shift:8 , mask:0x07},
 b: {shift:0 , mask:0x07},
};
const msx_8bitx2_def = {
 name: 'MSX 8bit x2 Palette',
 desc: 'RGB333 - 0RRR0BBB00000GGG (8ビット値×2個)',
 r: {shift:12 , mask:0x07},
 g: {shift:0  , mask:0x07},
 b: {shift:8  , mask:0x07},
};
//==========================================
// パレットフォーマットを参照してRGB888配列に変換
//==========================================
function doShiftAndMask(v, shift, mask) {
	return Math.floor(((v >> shift) & mask) * 0xFF / mask);
}
function toRGB888(v, f) {
	return {
		r:doShiftAndMask(v, f.r.shift, f.r.mask), // R
		g:doShiftAndMask(v, f.g.shift, f.g.mask), // G
		b:doShiftAndMask(v, f.b.shift, f.b.mask), // B
	};
}
		
//==========================================
// 16進数から数値へ変換
// $付き、0x付き、接頭辞無しに対応
//==========================================
function decodeHex(s) {
	s = s.replace(/(\/\/).+/g,'') // 行コメント除外
	s = s.replace(/$$([0-9A-F]+)/i,'0x$1');	// $nnnnを0xnnnnに
	s = s.match(/\b($$|0x)?[0-9A-F]+\b/i); // 16進数か検査
	if (!s) return -1;
	return parseInt(s[0], 16);
}
//==========================================
// 16進数文字列へ変換
//==========================================
function toHex(v, zero = '00') {
	var s = zero + v.toString(16).toUpperCase()
	return s.substr(s.length - zero.length);
}
//==========================================
// パレット文字列変換
//==========================================
function convertToBzPalette(s, format) {
	// スペース、カンマ、改行を区切り扱い
	// コメント等は非対応
	var ln = s.replace(/([^\s]+)\s+/g,'$1,').replace(/[,]/g,lf).split(lf);
	var out = [];
	for (var i = 0; i < ln.length; ++i) {
		var c = ln[i];
		if (!c.length) continue;
		var v = decodeHex(c);
		if (v<0) continue;
		var rgb = toRGB888(v, format);
		out.push( 
		  '0x' + toHex(i) + ' rgb' 
		  + '(0x' + toHex(rgb.r) // R
		  + ',0x' + toHex(rgb.g) // G
		  + ',0x' + toHex(rgb.b) // B
		  + ')'
		  + '\t// ' + c
		);
	}
	return out.join(lf);
}
//==========================================
// 変換開始処理
//==========================================
var opt_control = null;
var src_control = null;
var dst_control = null;
function convert() {
	if (!src_control) return;
	if (!dst_control) return;
	if (!opt_control) return;
	const opt_dic = {
		sfc_16bit : sfc_16bit_def,
		msx_16bit : msx_16bit_def,
		msx_8bitx2: msx_8bitx2_def,
	};
	var format = opt_dic[ opt_control.value ];
	if (!format) return;
	var res = convertToBzPalette( src_control.value, format );
	dst.innerText = 
	  '// ' + format.name + lf + 
	  '// ' + format.desc + lf + 
	  res;
	console.log(res);
}
//==========================================
// 読み込み完了時
//==========================================
window.onload = function() {
	opt_control = document.getElementById("opt");
	src_control = document.getElementById("src");
	dst_control = document.getElementById("dst");
}
// --> </script>
</head>
<body>
	<select id="opt">
		<option value="sfc_16bit" selected>SFC 16bitパレット</option>
		<option value="msx_16bit">MSX 16bitパレット</option>
		<option value="msx_8bitx2">MSX 8bitx2パレット（16bit値と並びが逆順）</option>
	</select>
	<form>
		<textarea id="src" rows="16" cols="24" placeholder="ここに16進数パレットを入力"></textarea><br>
		<button type="button" onclick="convert()">Bzパレットへ変換</button>
	</form>
	<div id="dst">ここに結果表示</div>
</body>
</html>
